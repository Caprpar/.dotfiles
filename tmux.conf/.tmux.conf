set -sg escape-time 5
# Aktivera mus (frivilligt, gör det enklare att markera)
set -g mouse on

# Använd vim-tangenter i copy-mode (valfritt)
setw -g mode-keys vi

# Space börjar markera, Enter kopierar till både tmux och systemets clipboard
bind -T copy-mode-vi Space send-keys -X begin-selection
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key ä split-window -h
bind-key ö split-window -v
# apply reload tmux.config at r
unbind r
bind r source-file ~/.tmux.conf

# Set ctrl+s as ctrl+g
set -g prefix C-s

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Harpoon-style session marks: mark sessions into numbered slots and
# jump straight to them, no fuzzy picker needed.
bind-key a run-shell "~/.local/bin/tmux-harpoon add"
bind-key A run-shell "~/.local/bin/tmux-harpoon remove"
bind-key m run-shell "~/.local/bin/tmux-harpoon menu"
bind-key -n M-1 run-shell "~/.local/bin/tmux-harpoon goto 1"
bind-key -n M-2 run-shell "~/.local/bin/tmux-harpoon goto 2"
bind-key -n M-3 run-shell "~/.local/bin/tmux-harpoon goto 3"
bind-key -n M-4 run-shell "~/.local/bin/tmux-harpoon goto 4"
bind-key -n M-n run-shell "~/.local/bin/tmux-harpoon next"
bind-key -n M-p run-shell "~/.local/bin/tmux-harpoon prev"

# Resize panes with prefix + shift + hjkl (repeatable while holding prefix)
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2

set-option -g status-position top
set-option -g update-environment "DISPLAY XAUTHORITY SSH_AUTH_SOCK"

# List of plugins
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'hallazzang/tmux-reset'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @resurrect-processes 'npm ssh'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin mankger (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
