; Polybar: gemensamt utseende, separata layouter för hemma och jobb.
; launch.sh väljer [bar/home] eller [bar/work] via MACHINE_PROFILE.

[colors]
background = #2a2535
background-alt = #3d3550
foreground = #c8bfe8
primary = #c8bfe8
secondary = #9b8ec4
disabled = #7a6fa0
alert = #d4a0a8

; Gemensamt utseende för båda profilerna.
[bar/base]
monitor = ${env:MONITOR:}
width = 100%
height = 25pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
label-padding = 5
separator = ""
separator-foreground = ${colors.disabled}
font-0 = CaskaydiaCove Nerd Font:bold;2
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; Redigera dessa tre listor för hemmadatorn.
[bar/home]
inherit = bar/base
modules-left = apple-icon xworkspaces xwindow
modules-center = current-timeblock
modules-right = current-database screenrec bluetooth github-status pulseaudio memory cpu vpn todays-worktime timer date

; Redigera dessa tre listor för jobbdatorn (archikat).
[bar/work]
inherit = bar/base
modules-left = apple-icon xworkspaces xwindow
modules-center = current-timeblock
modules-right = current-database screenrec bluetooth github-status pulseaudio memory cpu vpn todays-worktime timer date

; Ytterligare moduler att lägga till i valfri lista:
; battery downspeed filesystem player-online systray weather xkeyboard zeit zeit-today
; Endast en bar åt gången kan visa systray.

; Behåll 80 DPI på HDMI-A-0 och DisplayPort-0 utan att duplicera layouterna.
[bar/home-scaled]
inherit = bar/home
dpi = 80

[bar/work-scaled]
inherit = bar/work
dpi = 80

; Moduler ------------------------------------------------------------------

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/apple-icon]
type = custom/text
content = 󰣇
content-foreground = ${colors.primary}

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-foreground = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.primary}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
pin-workspaces = true
index-sort = false
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.secondary}

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 10

; Kontrollera namnen i /sys/class/power_supply/ innan modulen aktiveras.
battery = BAT0
adapter = ACAD
poll-interval = 5
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-charging-foreground = ${colors.secondary}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.secondary}
label-full = ""
label-low = BATTERY LOW

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

bar-capacity-width = 10

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-framerate = 500

ramp-capacity-foreground = ${colors.primary}
animation-charging-foreground = ${colors.primary}
animation-discharging-foreground = ${colors.primary}
label-low-foreground = ${colors.primary}
label-foreground = ${colors.primary}
label-full-foreground = ${colors.primary}
animation-low-0 = !
animation-low-1 =
animation-low-framerate = 200

[module/bluetooth]
type = custom/script
exec = ~/scripts/bluetooth-status.sh
interval = 5
label-foreground = ${colors.primary}
click-left = ~/scripts/bluetooth-status.sh --notify

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
reverse-scroll = true
format-volume = <ramp-volume>  <label-volume>
label-muted =  muted
label-muted-foreground = #666
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol
ramp-volume-foreground = ${colors.primary}
label-volume-foreground = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label-foreground = ${colors.secondary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label-foreground = ${colors.secondary}
label = %percentage:1%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format-prefix = ""
format-prefix-foreground = ${colors.primary}
label-layout = %layout%
label-layout-foreground = ${colors.secondary}
label-indicator-on-capslock = CL
label-indicator-on-capslock-foreground = ${colors.secondary}

[module/vpn]
type = custom/script
exec = ~/scripts/vpn-status.sh
interval = 5
label-foreground = ${colors.primary}

[module/current-database]
type = custom/script
exec = ~/scripts/polybar-current-database.sh
interval = 5
click-left = ~/scripts/polybar-database-dmenu.sh

[module/current-timeblock]
type = custom/script
exec = ~/scripts/watson-status.sh
interval = 5
label-foreground = ${colors.primary}
click-left = watson status ; notify-send "Watson" "$(watson status)"

[module/downspeed]
inherit = network-base
interface-type = wireless
label-connected = %downspeed%

[module/timer]
type = custom/script
exec = ~/scripts/polybar-timer.sh tail '' 1
tail = true

click-left = ~/scripts/polybar-timer.sh new 25 '' 'Paused' 'notify-send "Session finished"' ; ~/scripts/polybar-timer.sh update %pid%
click-middle = ~/scripts/polybar-timer.sh cancel ; ~/scripts/polybar-timer.sh update %pid%
click-right = ~/scripts/polybar-timer.sh togglepause ; ~/scripts/polybar-timer.sh update %pid%
scroll-up = ~/scripts/polybar-timer.sh increase 60 || ~/scripts/polybar-timer.sh new 1 '' 'PAUSED' 'notify-send -u critical "Timer expired."' ; ~/scripts/polybar-timer.sh update %pid%
scroll-down = ~/scripts/polybar-timer.sh increase -60 ; ~/scripts/polybar-timer.sh update %pid%
label-foreground = ${colors.secondary}

[module/todays-worktime]
type = custom/script
exec = ~/scripts/todays-worktime.sh
interval = 5
label-foreground = ${colors.primary}
click-left = notify-send "Watson" "$(watson report --day --ignore-project break)"

[module/github-status]
type = custom/script
exec = ~/scripts/polybar-github-status.sh
interval = 60
click-left = xdg-open https://www.githubstatus.com

[module/weather]
type = custom/script
exec = node ~/scripts/weather.js
interval = 600

[module/screenrec]
type = custom/ipc
hook-0 = ~/scripts/screenrec.sh status
initial = 1
click-left = ~/scripts/screenrec.sh

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %Y-%m-%d %H:%M:%S

label = %{F#F0C674}%date%
label-foreground = ${colors.primary}

[module/zeit]
type = custom/script
label = Zeit: %output%
exec = zeit
interval = 1

[module/zeit-today]
type = custom/script
label = Todays work: %output%
exec = zeit project sinom | awk '{print $5}' | tr -cd '0-9hms'
interval = 1

[module/player-online]
type = custom/script
label = Online %output%/20
exec = ssh contabo 'cd minecraft-server && docker compose exec -it server rcon-cli list' | awk '{print $3}'
interval = 60

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
